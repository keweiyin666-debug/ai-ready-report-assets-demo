<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f5f7fb"/>
  <rect x="60" y="60" width="520" height="600" rx="18" fill="#fff" stroke="#e5e7eb"/>
  <rect x="620" y="60" width="520" height="600" rx="18" fill="#fff" stroke="#e5e7eb"/>
  <text x="92" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">通过 MCP 查询企业有多少报表资产</text>
  <text x="92" y="160" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">通过 MCP 搜索到 10 个与“产能”相关的报表资产：</text>
  <rect x="92" y="205" width="455" height="270" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
  <g font-family="Arial, sans-serif" font-size="15">
    <text x="120" y="245" font-weight="700" fill="#111827">目录</text>
    <text x="342" y="245" font-weight="700" fill="#111827">报表数</text>
    <text x="432" y="245" font-weight="700" fill="#111827">报表名称</text>
    <line x1="110" y1="265" x2="530" y2="265" stroke="#e5e7eb"/>
    <text x="120" y="300" fill="#374151">Manufacturing/Capacity</text><text x="365" y="300" fill="#374151">2</text><text x="432" y="300" fill="#374151">产能达成汇总</text>
    <text x="120" y="340" fill="#374151">Production/Daily</text><text x="365" y="340" fill="#374151">1</text><text x="432" y="340" fill="#374151">日产量报表</text>
    <text x="120" y="380" fill="#374151">Equipment/Capacity</text><text x="365" y="380" fill="#374151">1</text><text x="432" y="380" fill="#374151">设备产能分析</text>
    <text x="120" y="420" fill="#374151">Planning/Schedule</text><text x="365" y="420" fill="#374151">1</text><text x="432" y="420" fill="#374151">排班产能预警</text>
  </g>
  <text x="92" y="525" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">覆盖成本模型、设备产能、产线日产能、排班产能、工段产能等场景。</text>
  <text x="650" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">mcp-search-result.json</text>
  <rect x="650" y="145" width="455" height="455" rx="12" fill="#0f172a"/>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#d1d5db">
    <text x="675" y="185">{</text>
    <text x="700" y="215">"tool": "asset_search",</text>
    <text x="700" y="245">"arguments": {</text>
    <text x="725" y="275">"keyword": "产能",</text>
    <text x="725" y="305">"source_tool": "finereport",</text>
    <text x="725" y="335">"limit": 10</text>
    <text x="700" y="365">},</text>
    <text x="700" y="395">"result": {</text>
    <text x="725" y="425">"matched_count": 10,</text>
    <text x="725" y="455">"items": [</text>
    <text x="750" y="485">"产能达成汇总",</text>
    <text x="750" y="515">"日产量报表",</text>
    <text x="750" y="545">"设备产能分析"</text>
    <text x="725" y="575">]</text>
  </g>
</svg>
