    <rect x="637" y="175" width="230" height="96" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="662" y="222" font-size="30" font-weight="700" fill="#111827">7,200+</text>
    <text x="662" y="252" font-size="16" fill="#6b7280">资产对象</text>
    <rect x="890" y="175" width="230" height="96" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="915" y="222" font-size="30" font-weight="700" fill="#111827">1</text>
    <text x="915" y="252" font-size="16" fill="#6b7280">扫描任务</text>
    <rect x="637" y="300" width="230" height="96" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="662" y="347" font-size="30" font-weight="700" fill="#111827">99.99%</text>
