  </g>
  <text x="637" y="455" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">当前失败 Top</text>
  <rect x="637" y="485" width="483" height="86" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
