  <rect x="72" y="190" width="456" height="56" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="94" y="226" font-family="Arial, sans-serif" font-size="18" fill="#111827">anonymous-fr · BI 报表源</text>
  <rect x="72" y="288" width="456" height="58" rx="13" fill="#2563eb"/>
  <text x="265" y="325" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#fff">开始扫描</text>
  <line x1="72" y1="390" x2="528" y2="390" stroke="#e5e7eb"/>
  <text x="240" y="397" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">或 上传文件触发扫描</text>
  <rect x="72" y="440" width="330" height="60" rx="12" fill="#fff" stroke="#e5e7eb"/>
