<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f5f7fb"/>
  <rect x="40" y="44" width="535" height="620" rx="20" fill="#fff" stroke="#e5e7eb"/>
  <rect x="605" y="44" width="555" height="620" rx="20" fill="#fff" stroke="#e5e7eb"/>
  <text x="72" y="92" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">扫描任务</text>
