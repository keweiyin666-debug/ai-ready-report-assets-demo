  <text x="474" y="477" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">上传并扫描</text>
  <rect x="72" y="535" width="456" height="86" rx="14" fill="#eef4ff" stroke="#dbeafe"/>
  <text x="96" y="570" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">等待扫描</text>
  <rect x="96" y="592" width="400" height="12" rx="6" fill="#d8e2f1"/>
  <text x="96" y="626" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">请选择目录或文件后开始扫描。</text>
  <text x="637" y="92" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">运行报告</text>
  <text x="637" y="132" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">扫描成功率、失败 Top 与 Registry 入库状态。</text>
