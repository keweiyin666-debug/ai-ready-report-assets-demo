    <rect x="185" y="524" width="84" height="34" rx="17" fill="#eef2f7"/><text x="227" y="546" font-size="15" text-anchor="middle" fill="#111827">so_num</text>
    <rect x="284" y="524" width="95" height="34" rx="17" fill="#eef2f7"/><text x="332" y="546" font-size="15" text-anchor="middle" fill="#111827">customer</text>
    <rect x="394" y="524" width="120" height="34" rx="17" fill="#eef2f7"/><text x="454" y="546" font-size="15" text-anchor="middle" fill="#111827">material_code</text>
