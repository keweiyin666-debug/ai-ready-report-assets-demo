    <text x="120" y="440" font-size="19" font-weight="700" fill="#111827">po_so_detail</text>
    <text x="120" y="485" font-size="15" fill="#6b7280">命中源表</text>
    <rect x="205" y="466" width="230" height="34" rx="17" fill="#e0ecff"/><text x="320" y="488" font-size="15" text-anchor="middle" fill="#1d4ed8">mfg_olap.v_order_sales_detail</text>
