  <rect x="90" y="620" width="1025" height="1" fill="#e5e7eb"/>
  <text x="90" y="648" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">用途：数据库表变更前，先评估哪些报表和数据集会受到影响。</text>
