  <text x="500" y="292" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#6b7280">10 个报表 · 34 处数据集引用</text>
  <rect x="90" y="340" width="1025" height="260" rx="14" fill="#f8fafc" stroke="#e5e7eb"/>
  <g font-family="Arial, sans-serif">
    <rect x="90" y="340" width="1025" height="54" rx="14" fill="#f1f5f9"/>
    <text x="120" y="374" font-size="16" font-weight="700" fill="#2563eb">po_so_consistency · 4 个数据集</text>
