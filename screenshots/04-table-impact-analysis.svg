  <rect x="90" y="182" width="815" height="56" rx="12" fill="#fff" stroke="#e5e7eb"/>
  <text x="115" y="217" font-family="Arial, sans-serif" font-size="18" fill="#111827">mfg_olap.v_order_sales_detail</text>
  <rect x="925" y="182" width="95" height="56" rx="12" fill="#fff" stroke="#e5e7eb"/>
  <text x="973" y="217" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#111827">精确匹配</text>
  <rect x="1035" y="182" width="80" height="56" rx="12" fill="#2563eb"/>
  <text x="1075" y="217" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">查询</text>
  <text x="90" y="292" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#111827">表 mfg_olap.v_order_sales_detail 的引用情况</text>
